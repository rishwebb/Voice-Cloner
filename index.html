<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Note Studio</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/db1tiugho/image/upload/f_png,q_auto:eco,r_max/v1772947434/LOGO_oprvqu.png">
    <link rel="shortcut icon" type="image/png" href="https://res.cloudinary.com/db1tiugho/image/upload/f_png,q_auto:eco,r_max/v1772947434/LOGO_oprvqu.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --primary: #000000;
            --primary-hover: #1f2937;
            --bg-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            margin: 0;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: auto;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05) inset;
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 10;
            transform: translateY(0);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #0f172a, #64748b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .step {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
        }
        
        .step::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.1), transparent);
        }

        .step:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .step:last-child::after {
            display: none;
        }

        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary);
            border: 1px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            background: #1f2937;
        }
        
        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: #334155;
            box-shadow: none;
            cursor: not-allowed;
            color: #64748b;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-color: rgba(0, 0, 0, 0.3);
        }

        /* File Input Styling */
        .file-upload-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .file-upload-label {
            display: block;
            padding: 1.5rem;
            background: rgba(241, 245, 249, 0.8);
            border: 2px dashed rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .file-upload-label:hover {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
        }

        .file-upload-label.has-file {
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.05);
            color: var(--primary);
        }

        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .status-container {
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        .status-container.error {
            color: #ef4444;
            animation: shake 0.5s;
        }

        .status-container.success {
            color: var(--primary);
        }

        .status-container.loading {
            color: #60a5fa;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .upload-icon {
            display: block;
            margin: 0 auto 0.5rem auto;
            width: 28px;
            height: 28px;
            opacity: 0.7;
            transition: opacity 0.3s, transform 0.3s;
        }

        .file-upload-label:hover .upload-icon {
            opacity: 1;
            transform: translateY(-2px);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <div class="step">
            <div class="step-badge">1</div>
            <h1>Generate Voice</h1>
            <p class="subtitle">Create your audio on Hugging Face first.</p>
            <a href="https://huggingface.co/spaces/Qwen/Qwen3-TTS" target="_blank" class="btn btn-outline">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                Clone Your Voice
            </a>
        </div>

        <div class="step">
            <div class="step-badge">2</div>
            <h1>Convert for WhatsApp</h1>
            <p class="subtitle">Format your audio track for WhatsApp voice notes.</p>
            
            <div class="file-upload-wrapper">
                <label id="fileLabel" class="file-upload-label">
                    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <span id="fileName">Select or drag audio file here</span>
                    <input type="file" id="audioInput" accept="audio/*">
                </label>
            </div>

            <button id="convertBtn" class="btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                Convert to Opus
            </button>
            <div id="status" class="status-container"></div>
            
            <a id="downloadBtn" class="btn" style="display: none; margin-top: 1rem; background: #000000; color: #fff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Voice Note
            </a>
        </div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;

        const ffmpeg = createFFmpeg({
            log: true,
            corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
        });

        const convertBtn = document.getElementById('convertBtn');
        const fileInput = document.getElementById('audioInput');
        const fileLabel = document.getElementById('fileLabel');
        const fileNameSpan = document.getElementById('fileName');
        const statusDiv = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');

        // Elegant file input handling
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const name = e.target.files[0].name;
                fileNameSpan.textContent = name;
                fileLabel.classList.add('has-file');
                statusDiv.innerText = '';
                statusDiv.className = 'status-container';
            } else {
                fileNameSpan.textContent = 'Select or drag audio file here';
                fileLabel.classList.remove('has-file');
            }
        });

        function setStatus(msg, type = '') {
            statusDiv.className = `status-container ${type}`;
            if (type === 'loading') {
                statusDiv.innerHTML = `<span class="spinner"></span>${msg}`;
            } else {
                statusDiv.innerText = msg;
            }
        }

        convertBtn.addEventListener('click', async () => {
            if (fileInput.files.length === 0) {
                setStatus('Please select an audio file first.', 'error');
                return;
            }

            const file = fileInput.files[0];
            const inputName = 'input_audio' + file.name.substring(file.name.lastIndexOf('.'));

            try {
                convertBtn.disabled = true;
                fileInput.disabled = true;
                downloadBtn.style.display = 'none';
                
                setStatus('Loading FFmpeg engine...', 'loading');

                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                setStatus('Converting audio to Opus format...', 'loading');

                ffmpeg.FS('writeFile', inputName, await fetchFile(file));

                await ffmpeg.run('-i', inputName, '-c:a', 'libopus', 'output.opus');

                const data = ffmpeg.FS('readFile', 'output.opus');

                const audioBlob = new Blob([data.buffer], { type: 'audio/opus' });
                const audioUrl = URL.createObjectURL(audioBlob);

                downloadBtn.href = audioUrl;
                downloadBtn.download = 'whatsapp-voicenote.opus';
                downloadBtn.style.display = 'inline-flex';
                downloadBtn.classList.add('btn');

                setStatus('Conversion successful! Ready to send.', 'success');
            } catch (error) {
                console.error(error);
                setStatus('Error during conversion. Check browser console.', 'error');
            } finally {
                convertBtn.disabled = false;
                fileInput.disabled = false;
            }
        });

        // --- Interactive Particle Grid Background ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let mouse = {
            x: null,
            y: null,
            radius: (canvas.height/120) * (canvas.width/120)
        }

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < mouse.radius + this.size){
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
                        this.x += 10;
                    }
                    if (mouse.x > this.x && this.x > this.size * 10) {
                        this.x -= 10;
                    }
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
                        this.y += 10;
                    }
                    if (mouse.y > this.y && this.y > this.size * 10) {
                        this.y -= 10;
                    }
                }
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 5) - 2.5;
                let directionY = (Math.random() * 5) - 2.5;
                particlesArray.push(new Particle(x, y, directionX, directionY, size, '#0f172a'));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0,0,innerWidth, innerHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = (( particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + (( particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/20000);
                        ctx.strokeStyle = 'rgba(15, 23, 42,' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        window.addEventListener('resize', function() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            mouse.radius = ((canvas.height/80) * (canvas.height/80));
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
